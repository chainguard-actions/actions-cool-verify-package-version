name: Test title-include-content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create mock package.json
        run: |
          echo '{"version":"1.2.3"}' > package.json
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          title-include-content: "feat"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail if there's no real PR context, but it should at least start
          # We verify it ran (not skipped) and produced an outcome
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped"
            exit 1
          fi
          echo "PASS: action ran with outcome ${{ steps.action.outcome }}"
