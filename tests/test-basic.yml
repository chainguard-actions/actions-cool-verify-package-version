name: Test basic usage - title-include-content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with title-include-content
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          title-include-content: 'feat'
          open-comment: 'false'
        continue-on-error: true
      - name: Assert action ran without unexpected failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail depending on PR context,
          # but it should not error out with a missing module or crash.
          # Under workflow_dispatch there is no PR title, so the action
          # may report failure — that is acceptable behavior.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
